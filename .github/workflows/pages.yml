name: Deploy to GitHub Pages

on:
  push:
    branches: [decomp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (remove non-web files)
        run: |
          # Remove Node/test-only directories that don't belong in the browser
          rm -rf calc/test
          rm -rf cypress
          rm -rf node_modules
          rm -rf scripts
          rm -f package.json package-lock.json
          rm -f *.py *.spec *.lua *.rb
          rm -f gen5_expert_ai.md README.md AGENTS.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
